plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

repositories {
    mavenCentral()
    maven { url "https://maven.shedaniel.me/" }
    maven { url "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/" }
    // Immersively Vibed Portals has no Maven repository; take the jar from its GitHub release
    exclusiveContent {
        forRepository {
            ivy {
                name = "ImmersivelyVibedPortals"
                url = "https://github.com/nyannoying1337/ImmersivelyVibedPortals/releases/download/"
                patternLayout { artifact "v[revision]/[module]-[revision]-mc26.3-fabric.[ext]" }
                metadataSources { artifact() }
            }
        }
        filter { includeGroup "nyannoying1337" }
    }
    exclusiveContent {
        forRepository { maven { name = "Modrinth"; url = "https://api.modrinth.com/maven" } }
        filter { includeGroup "maven.modrinth" }
    }
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = "portalgun_gametest"
        enableGameTests = false
        enableClientGameTests = true
        clearRunDirectory = !providers.gradleProperty("withPackMods").isPresent()
    }
}

loom {
    runs {
        clientGameTest {
            programArgs "--width", "1280", "--height", "720"
            property "portalgun.test.out", file("build/portal-test").absolutePath
            // -Pscene=dh: Distant Horizons scene (LODs must stay behind walls while portals exist)
            property "portalgun.test.scene", providers.gradleProperty("scene").getOrElse("basic")
        }
    }
}

// -PwithPackMods: also load the user's mod set (Sodium, Iris, Distant Horizons, Physics Mod, ...) from packmods/
def packMods = providers.gradleProperty("withPackMods").isPresent()

dependencies {
    if (packMods) {
        localRuntime fileTree(dir: "packmods", include: "*.jar")
    }
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Immersive Portals' 26.3 port (Immersively Vibed Portals, which bundles DimLib) and GeckoLib 5
    implementation "nyannoying1337:immersively-vibed-portals:${project.ivp_version}"
    implementation "com.geckolib:geckolib-fabric-${project.minecraft_version}:${project.geckolib_version}"

    implementation("me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }
    compileOnly "maven.modrinth:modmenu:${modmenu_version}"
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") { expand "version": project.version }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.compilerArgs += ["-Xmaxerrs", "10000"]
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    archiveFileName = "${project.archives_base_name}-${project.mod_version}-mc${project.minecraft_version}-fabric.jar"
    from("LICENSE") { rename { "${it}_${project.archives_base_name}" } }
}
